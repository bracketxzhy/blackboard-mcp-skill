name: Validate skill and runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assets/server/package-lock.json
      - run: npm ci
        working-directory: assets/server
      - run: npm run typecheck
        working-directory: assets/server
      - run: npm run build
        working-directory: assets/server
      - run: npm test
        working-directory: assets/server
      - run: node --test scripts/workflow.test.mjs
